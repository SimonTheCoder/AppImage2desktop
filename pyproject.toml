[project]
name = "appimage2desktop"
version = "0.2.2"
description = "GUI tool to integrate AppImage applications into KDE Plasma desktop"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Simon", email = "me@simonthecoder.top"},
]
keywords = ["appimage", "kde", "plasma", "desktop", "integration"]

[project.scripts]
appimage2desktop = "appimage2desktop.main:main"

[tool.setuptools.package-data]
appimage2desktop = ["icon.png"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
